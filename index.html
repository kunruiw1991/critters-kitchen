<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Panda Chef 3D - Magic Stir-Pot &amp; Snack Tosser</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --sky-top: #7ae5ff;
      --wall-mint: #64dfdf;
      --counter-wood: #d98a36;
      --counter-dark: #8c510a;
      --card-bg: #fffdf7;
      --card-border: #ff9f1c;
      --serve-green: #2ec4b6;
      --serve-bright: #38b000;
      --reset-blue: #0096c7;
      --fart-lime: #70e000;
      --fart-yellow: #ccff33;
      --pink-accent: #ff4d8d;
      --gold-star: #ffd60a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #48cae4;
      font-family: "Comic Sans MS", "Chalkboard SE", "Fredoka", "Arial Rounded MT Bold", sans-serif;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Full-screen Three.js 3D Canvas */
    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* HUD Overlay Layer */
    #hud-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 18px 14px;
    }

    /* TOP HUD BAR */
    .top-hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
    }

    .top-left-group {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      flex-wrap: wrap;
    }

    /* Self-Explanatory Visual Recipe Suggestion Card (#recipe-card-0) */
    #recipe-card-0 {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #fff8e7 100%);
      border: 5px solid var(--card-border);
      border-radius: 30px;
      padding: 8px 14px;
      box-shadow: 0 8px 0 #d97706, 0 12px 24px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.25s;
    }

    #recipe-card-0:hover {
      transform: translateY(-2px) scale(1.01);
    }

    #recipe-card-0.recipe-complete {
      border-color: #38b000;
      box-shadow: 0 8px 0 #1b4332, 0 0 28px rgba(56, 176, 0, 0.75);
      animation: pulseCard 0.9s infinite alternate ease-in-out;
    }

    #recipe-card-0.freeplay-mode {
      border-color: #9d4edd;
      background: linear-gradient(180deg, #faf5ff 0%, #f3e8ff 100%);
      box-shadow: 0 8px 0 #5a189a, 0 12px 24px rgba(90, 24, 154, 0.25);
    }

    .recipe-badge-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff3b0;
      border: 3px solid #f48c06;
      border-radius: 18px;
      padding: 4px 10px;
      min-width: 78px;
    }

    .recipe-badge-header .badge-emoji {
      font-size: 24px;
      line-height: 1;
    }

    .recipe-badge-header .badge-title {
      font-size: 11px;
      font-weight: 900;
      color: #9a3412;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: 2px;
      text-align: center;
    }

    .recipe-items-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .recipe-slot {
      position: relative;
      width: 68px;
      height: 76px;
      border-radius: 16px;
      background: #ffffff;
      border: 3px dashed #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3px 3px 2px;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s, background 0.2s;
    }

    .recipe-slot img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 10px;
    }

    .recipe-slot .slot-name {
      font-size: 9.5px;
      font-weight: 900;
      color: #1e293b;
      text-transform: uppercase;
      line-height: 1.05;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recipe-slot.matched {
      border: 3px solid #38b000;
      background: #d8f3dc;
      transform: scale(1.07);
    }

    .slot-check {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #38b000;
      border: 2.5px solid #ffffff;
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 3px 6px rgba(0,0,0,0.25);
    }

    .recipe-slot.matched .slot-check {
      transform: scale(1);
    }

    .recipe-plus {
      font-size: 20px;
      font-weight: 900;
      color: #f48c06;
    }

    .recipe-bonus-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ffd60a 0%, #fca311 100%);
      border: 3px solid #b45309;
      border-radius: 18px;
      padding: 5px 10px;
      color: #78350f;
      font-weight: 900;
      font-size: 15px;
      box-shadow: inset 0 2px 3px #ffffff;
    }

    .recipe-bonus-pill span {
      font-size: 10px;
      text-transform: uppercase;
    }

    /* Clear Shuffle Recipe / Free-Play Button (#btn-mode-freeplay) */
    #btn-mode-freeplay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 96px;
      height: 82px;
      padding: 6px 12px;
      border-radius: 24px;
      border: 4px solid #ffffff;
      background: linear-gradient(180deg, #9d4edd 0%, #5a189a 100%);
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 7px 0 #3c096c, 0 10px 18px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #btn-mode-freeplay:hover {
      transform: translateY(-3px) scale(1.04);
    }

    #btn-mode-freeplay:active {
      transform: translateY(3px) scale(0.96);
    }

    #btn-mode-freeplay .mode-icon {
      font-size: 28px;
      line-height: 1;
    }

    #btn-mode-freeplay .mode-label {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.35);
    }

    /* Top-Right Star Counter & Fun Quick Triggers */
    .top-right-group {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .quick-gag-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 78px;
      min-width: 82px;
      padding: 6px 10px;
      border-radius: 22px;
      border: 4px solid #ffffff;
      cursor: pointer;
      font-family: inherit;
      font-weight: 900;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .quick-gag-btn:hover {
      transform: translateY(-3px) scale(1.05);
    }

    #btn-trigger-fart {
      background: linear-gradient(180deg, #80ed99 0%, #38b000 100%);
      color: #081c15;
      box-shadow: 0 7px 0 #1b4332, 0 10px 18px rgba(0,0,0,0.22);
    }

    .quick-gag-btn .gag-emoji {
      font-size: 27px;
      line-height: 1;
    }

    .quick-gag-btn .gag-text {
      font-size: 10.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    #star-counter {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, #fffbeb 0%, #fde047 100%);
      border: 5px solid #f59e0b;
      border-radius: 34px;
      padding: 8px 18px;
      min-height: 78px;
      box-shadow: 0 8px 0 #b45309, 0 12px 22px rgba(0, 0, 0, 0.22);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #star-counter.bump {
      transform: scale(1.16);
    }

    .star-big-icon {
      font-size: 38px;
      line-height: 1;
      filter: drop-shadow(0 3px 3px rgba(180, 83, 9, 0.35));
    }

    #star-count-value {
      font-size: 34px;
      font-weight: 900;
      color: #78350f;
      text-shadow: 0 2px 0 #ffffff;
    }

    /* CENTER STAGE OVERLAY: Pot Floating Controls, Speech Bubbles, Fart Cloud, Kid Panda */
    .center-stage-overlay {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Pot Left/Right Action Buttons (#btn-reset-stew & #btn-cook-serve) — Widened & Raised Off the Pot! */
    .pot-controls-ring {
      position: relative;
      width: min(980px, 95vw);
      height: 310px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 68px;
      pointer-events: none;
    }

    #btn-reset-stew {
      pointer-events: auto;
      width: 114px;
      height: 114px;
      border-radius: 50%;
      border: 6px solid #ffffff;
      background: radial-gradient(circle at 35% 30%, #48cae4 0%, #0077b6 100%);
      box-shadow: 0 9px 0 #023e8a, 0 14px 26px rgba(0, 0, 0, 0.32);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #btn-reset-stew:hover {
      transform: translateY(-4px) scale(1.06);
    }

    #btn-reset-stew:active {
      transform: translateY(4px) scale(0.95);
    }

    #btn-reset-stew .btn-icon {
      font-size: 38px;
      line-height: 1;
    }

    #btn-reset-stew .btn-label {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 3px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.45);
    }

    /* Visual Floating Contents Badge on Pot so player can see every added food clearly */
    #pot-contents-layer {
      position: absolute;
      left: 50%;
      bottom: 62px;
      transform: translateX(-50%);
      width: 280px;
      height: 92px;
      border-radius: 50%;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 18px;
      z-index: 14;
    }

    .pot-floating-chip {
      position: relative;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      overflow: visible;
    }

    .pot-floating-chip .chip-img-wrap {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
    }

    .pot-floating-chip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .chip-count-badge {
      position: absolute;
      top: -7px;
      right: -9px;
      min-width: 24px;
      height: 22px;
      padding: 0 5px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff4d8d 0%, #e11d48 100%);
      border: 2.5px solid #ffffff;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      line-height: 17px;
      text-align: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.35);
      z-index: 2;
      pointer-events: none;
    }

    #btn-cook-serve {
      pointer-events: auto;
      width: 128px;
      height: 128px;
      border-radius: 50%;
      border: 6px solid #ffffff;
      background: radial-gradient(circle at 35% 30%, #80ed99 0%, #2b9348 100%);
      box-shadow: 0 10px 0 #1b4332, 0 16px 30px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      animation: pulseServe 1.5s infinite ease-in-out;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #btn-cook-serve:hover {
      transform: translateY(-5px) scale(1.08);
    }

    #btn-cook-serve:active {
      transform: translateY(4px) scale(0.95);
    }

    #btn-cook-serve .btn-icon {
      font-size: 44px;
      line-height: 1;
    }

    #btn-cook-serve .btn-label {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 3px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.45);
    }

    /* BROCCOLI KNOCK-AWAY & EMPTY POT MULTI-LINE QUOTE BUBBLE ON THE LEFT (#broccoli-bubble) */
    #broccoli-bubble {
      position: fixed;
      top: 132px;
      left: 28px;
      width: 370px;
      max-width: 32vw;
      transform: translate(-16px, 0) scale(0);
      transform-origin: right center;
      background: linear-gradient(180deg, #fff0f3 0%, #ffccd5 100%);
      border: 6px solid #e11d48;
      border-radius: 32px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 0 #9f1239, 0 18px 34px rgba(0, 0, 0, 0.35);
      z-index: 35;
      opacity: 0;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
    }

    #broccoli-bubble::before {
      content: "";
      position: absolute;
      right: -26px;
      top: 34px;
      border-width: 14px 0 14px 26px;
      border-style: solid;
      border-color: transparent transparent transparent #e11d48;
    }

    #broccoli-bubble::after {
      content: "";
      position: absolute;
      right: -16px;
      top: 38px;
      border-width: 10px 0 10px 18px;
      border-style: solid;
      border-color: transparent transparent transparent #ffe3e8;
    }

    #broccoli-bubble.active {
      transform: translate(0, 0) scale(1);
      opacity: 1;
    }

    #broccoli-bubble .yuck-face {
      font-size: 40px;
      line-height: 1;
      flex-shrink: 0;
    }

    #broccoli-bubble .broccoli-msg {
      font-size: 24px;
      line-height: 1.25;
      font-weight: 900;
      color: #9f1239;
      text-shadow: 0 2px 0 #ffffff;
      white-space: normal;
      word-wrap: break-word;
      text-align: left;
    }

    /* UNMISTAKABLE CARTOON FART COMING DIRECTLY FROM THE 3D PANDA'S BUM (#fart-cloud) */
    #fart-cloud {
      position: fixed;
      left: 64%;
      top: 48%;
      transform: translate(0%, -50%) scale(0);
      transform-origin: left center;
      z-index: 45;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s;
      filter: drop-shadow(0 12px 18px rgba(43, 147, 72, 0.45));
    }

    #fart-cloud.active {
      transform: translate(0%, -50%) scale(1);
      opacity: 1;
      animation: fartWobble 0.30s infinite alternate ease-in-out;
    }

    .fart-scene-svg {
      width: 280px;
      height: 190px;
      overflow: visible;
    }

    /* SMALL KID PANDA VISITOR (#kid-panda) — Appears in BOTH Cooking & Dining with Noogler Hat & Chubby Legs! */
    #kid-panda {
      position: fixed;
      left: 24px;
      bottom: 158px;
      width: 155px;
      height: 215px;
      z-index: 26;
      pointer-events: auto;
      cursor: pointer;
      transform: translateY(240px) scale(0.8);
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s, left 0.45s, bottom 0.45s;
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.3));
    }

    #kid-panda.active {
      transform: translateY(0) scale(1);
      opacity: 1;
      animation: kidPandaHop 1.5s infinite alternate ease-in-out;
    }

    #kid-panda.dining-pos {
      left: 28px;
      bottom: 138px;
      z-index: 60;
    }

    .kid-speech-tag {
      position: absolute;
      top: -36px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 4px solid #ff4d8d;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 900;
      color: #9d174d;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 5;
    }

    /* Comic Smack Burst Badge shown when Panda smacks Broccoli away! */
    .smack-impact-badge {
      position: fixed;
      transform: translate(-50%, -50%) scale(0);
      background: radial-gradient(circle, #fde047 0%, #f97316 70%, #dc2626 100%);
      border: 5px solid #ffffff;
      border-radius: 36px;
      padding: 8px 18px;
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 3px 0 #7c2d12;
      box-shadow: 0 8px 20px rgba(220, 38, 38, 0.5);
      pointer-events: none;
      z-index: 55;
      white-space: nowrap;
    }

    .ingredient-btn.pulse-hint {
      animation: pulseServe 0.45s 3 ease-in-out;
      border-color: #ffd60a;
    }

    /* BOTTOM HUD: 10 UNMISTAKABLE FOOD ILLUSTRATION CARDS WITH CLEAR LABELS */
    .pantry-dock {
      pointer-events: auto;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .pantry-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(84px, 112px));
      gap: 10px;
      background: linear-gradient(180deg, rgba(255, 250, 235, 0.95) 0%, rgba(254, 243, 199, 0.98) 100%);
      border: 5px solid #d97706;
      border-radius: 30px;
      padding: 10px 14px;
      box-shadow: 0 10px 0 #92400e, 0 18px 32px rgba(0, 0, 0, 0.32);
      max-width: 100%;
    }

    .ingredient-btn {
      position: relative;
      height: 112px;
      border-radius: 22px;
      border: 4px solid #ffffff;
      background: #ffffff;
      box-shadow: 0 7px 0 #64748b, 0 10px 16px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 5px 4px;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s;
      overflow: hidden;
    }

    .ingredient-btn:hover {
      transform: translateY(-6px) scale(1.06);
      z-index: 5;
    }

    .ingredient-btn:active {
      transform: translateY(3px) scale(0.95);
    }

    .ingredient-btn.broccoli-warn {
      border-color: #84cc16;
      box-shadow: 0 7px 0 #3f6212, 0 10px 16px rgba(0,0,0,0.2);
    }

    .ingredient-art-wrap {
      width: 100%;
      height: 76px;
      border-radius: 14px;
      overflow: hidden;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ingredient-art-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ingredient-name-pill {
      width: 100%;
      background: #1e293b;
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      text-align: center;
      padding: 2.5px 4px;
      border-radius: 10px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #ingredient-seaweed .ingredient-name-pill { background: #065f46; }
    #ingredient-cheetos .ingredient-name-pill { background: #ea580c; }
    #ingredient-gummy-bears .ingredient-name-pill { background: #e11d48; }
    #ingredient-pasta .ingredient-name-pill { background: #b91c1c; }
    #ingredient-broccoli .ingredient-name-pill { background: #3f6212; }
    #ingredient-bamboo .ingredient-name-pill { background: #15803d; }
    #ingredient-dumpling .ingredient-name-pill { background: #0369a1; }
    #ingredient-strawberry .ingredient-name-pill { background: #be123c; }
    #ingredient-marshmallows .ingredient-name-pill { background: #9333ea; }
    #ingredient-sprinkles .ingredient-name-pill { background: #7e22ce; }

    /* DINING TABLE SERVING & CELEBRATION OVERLAY (#dining-table-scene) */
    #dining-table-scene {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px 24px;
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #dining-table-scene.active {
      pointer-events: auto;
      opacity: 1;
      transform: scale(1);
    }

    body.in-dining-mode .pantry-dock,
    body.in-dining-mode .center-stage-overlay {
      opacity: 0;
      pointer-events: none;
    }

    body.farting-now #btn-cook-serve {

    // Randomize 3 distinct tasty ingredients ensuring the new recipe differs from the previous one
    function randomizeTargetRecipe() {
      const prevKey = (window.gameState.currentRecipe || []).slice().sort().join(",");
      let candidate = TASTY_INGREDIENTS.slice(0, 3);
      for (let attempt = 0; attempt < 25; attempt++) {
        const pool = TASTY_INGREDIENTS.slice();
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = pool[i];
          pool[i] = pool[j];
          pool[j] = tmp;
        }
        candidate = pool.slice(0, 3);
        if (candidate.slice().sort().join(",") !== prevKey) {
          break;
        }
      }
      window.gameState.currentRecipe = candidate;
      return candidate;
    }

    const SoundFX = (function () {
      let ctx = null;
      let cachedVoices = [];
      let kidVoiceQueueTimer = null;

      function getCtx() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        }
        if (ctx && ctx.state === "suspended") {

        return ctx;
      }

      function refreshVoices() {
        try {
          if ("speechSynthesis" in window) {
            const list = window.speechSynthesis.getVoices();
            if (list && list.length > 0) {
              cachedVoices = list;
            }
          }
        } catch (e) {}
      }

      if ("speechSynthesis" in window) {
        refreshVoices();
        try {
          window.speechSynthesis.onvoiceschanged = refreshVoices;
        } catch (e) {}
      }

      function cleanSpeechText(rawText) {
        return String(rawText || "")
          .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}]/gu, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function pickWomanVoice() {
        refreshVoices();
        if (!cachedVoices.length) return null;
        const enVoices = cachedVoices.filter((v) => /^en(-|_|$)/i.test(v.lang || ""));
        const pool = enVoices.length ? enVoices : cachedVoices;

        const preferredWomanNames = [
          "Google US English",
          "Google UK English Female",
          "Samantha",
          "Victoria",
          "Karen",
          "Moira",
          "Tessa",
          "Microsoft Aria",
          "Microsoft Jenny",
          "Microsoft Sonia",
          "Microsoft Zira",
          "Ava",
          "Allison",
          "Susan",
          "Fiona",
          "Veena",
          "Martha",
          "Catherine",
          "Nicky"
        ];
        for (let i = 0; i < preferredWomanNames.length; i++) {
          const target = preferredWomanNames[i].toLowerCase();
          const match = pool.find((v) => (v.name || "").toLowerCase().includes(target));
          if (match) return match;
        }

        const explicitFemale = pool.find(
          (v) => /\b(female|woman|girl)\b/i.test(v.name || "") && !/\bmale\b/i.test(v.name || "")
        );
        if (explicitFemale) return explicitFemale;

        const nonMale = pool.find(
          (v) => !/\b(male|man|alex|daniel|fred|david|mark|george|james|richard|guy|thomas|oliver|aaron|arthur|gordon|lee|ralph|bruce|albert)\b/i.test(v.name || "")
        );
        return nonMale || pool[0];
      }

      function pickYoungChildVoice() {
        refreshVoices();
        if (!cachedVoices.length) return null;
        const enVoices = cachedVoices.filter((v) => /^en(-|_|$)/i.test(v.lang || ""));
        const pool = enVoices.length ? enVoices : cachedVoices;

        const preferredYoungNames = [
          "Flo",
          "Sandy",
          "Shelley",
          "Junior",
          "Microsoft Ana",
          "Tessa",
          "Samantha",
          "Victoria",
          "Karen",
          "Google US English",
          "Google UK English Female",
          "Microsoft Zira"
        ];
        for (let i = 0; i < preferredYoungNames.length; i++) {
          const target = preferredYoungNames[i].toLowerCase();
          const match = pool.find((v) => (v.name || "").toLowerCase().includes(target));
          if (match) return match;
        }
        return pickWomanVoice() || pool[0];
      }

      function playVocalMelody(isYoungChild) {
        try {
          const c = getCtx();
          if (!c) return;
          const now = c.currentTime;
          const freqs = isYoungChild ? [659.25, 783.99, 987.77] : [392.0, 493.88, 587.33];
          freqs.forEach((f, idx) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(f, now + idx * 0.055);
            gain.gain.setValueAtTime(0.06, now + idx * 0.055);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.14);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now + idx * 0.055);
            osc.stop(now + idx * 0.055 + 0.14);
          });

        try {
          if ("speechSynthesis" in window) {
            if (kidVoiceQueueTimer) {

            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            if (voice) u.voice = voice;
            u.lang = (voice && voice.lang) || "en-US";
            u.pitch = 1.08;
            u.rate = 1.0;
            u.volume = 0.95;
            u.onend = finishOnce;

            const osc = c.createOscillator();

            const lfoGain = c.createGain();
            const filter = c.createBiquadFilter();

            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(82, now);
            osc.frequency.linearRampToValueAtTime(46, now + 0.25);
            osc.frequency.linearRampToValueAtTime(64, now + 0.42);

            lfo.type = "square";
            lfo.frequency.setValueAtTime(28, now);
            lfoGain.gain.setValueAtTime(32, now);
            lfo.connect(osc.frequency);

            filter.type = "lowpass";
            filter.frequency.setValueAtTime(340, now);

            mainGain.gain.setValueAtTime(0.32, now);
            mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.62);

            osc.connect(filter);
            filter.connect(mainGain);
            mainGain.connect(c.destination);

            osc.start(now);
            lfo.start(now);
            osc.stop(now + 0.62);
            lfo.stop(now + 0.62);

                osc.start(c.currentTime + idx * 0.11);

          speakPandaWoman(compliment || "Yumm! You're the best chef!");

    // Generate organic mottled simmering broth color & bump textures via HTML5 Canvas
    function createSimmeringBrothTextures() {
      const colorCanvas = document.createElement("canvas");
      colorCanvas.width = 256;
      colorCanvas.height = 256;
      const cctx = colorCanvas.getContext("2d");

      const bumpCanvas = document.createElement("canvas");
      bumpCanvas.width = 256;
      bumpCanvas.height = 256;
      const bctx = bumpCanvas.getContext("2d");

      // Warm golden-amber radial broth base
      const grad = cctx.createRadialGradient(128, 128, 14, 128, 128, 128);
      grad.addColorStop(0, "#fff3b0");
      grad.addColorStop(0.55, "#ffd166");
      grad.addColorStop(0.88, "#f4a261");
      grad.addColorStop(1, "#e76f51");
      cctx.fillStyle = grad;
      cctx.fillRect(0, 0, 256, 256);

      bctx.fillStyle = "#808080";
      bctx.fillRect(0, 0, 256, 256);

      // Organic simmering convection cells, oil droplets, and frothy foam rings
      for (let i = 0; i < 140; i++) {
        const angle = (i * 2.39996) % (Math.PI * 2);
        const dist = Math.sqrt(i / 140) * 116;
        const cx = 128 + Math.cos(angle) * dist;
        const cy = 128 + Math.sin(angle) * dist;
        const r = 4 + (i % 7) * 2.4;

        // Broth droplet / ripple in color map
        cctx.beginPath();
        cctx.arc(cx, cy, r, 0, Math.PI * 2);
        if (i % 5 === 0) {
          cctx.fillStyle = "rgba(255, 251, 235, 0.55)";
          cctx.fill();
        } else if (i % 3 === 0) {
          cctx.strokeStyle = "rgba(245, 158, 11, 0.45)";
          cctx.lineWidth = 2;
          cctx.stroke();
        } else {
          cctx.fillStyle = "rgba(253, 224, 71, 0.38)";
          cctx.fill();
        }

        // Corresponding bump dome in bump map
        const bGrad = bctx.createRadialGradient(cx, cy, 1, cx, cy, r * 1.4);
        bGrad.addColorStop(0, "#ffffff");
        bGrad.addColorStop(0.6, "#b0b0b0");
        bGrad.addColorStop(1, "#606060");
        bctx.fillStyle = bGrad;
        bctx.beginPath();
        bctx.arc(cx, cy, r * 1.4, 0, Math.PI * 2);
        bctx.fill();
      }

      // Subtle herb flecks in the broth
      for (let j = 0; j < 36; j++) {
        const a = (j * 1.7) % (Math.PI * 2);
        const d = 18 + ((j * 19) % 92);
        cctx.fillStyle = "rgba(22, 163, 74, 0.55)";
        cctx.beginPath();
        cctx.arc(128 + Math.cos(a) * d, 128 + Math.sin(a) * d, 2.2, 0, Math.PI * 2);
        cctx.fill();
      }

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.wrapS = THREE.RepeatWrapping;
      colorTex.wrapT = THREE.RepeatWrapping;
      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.wrapS = THREE.RepeatWrapping;
      bumpTex.wrapT = THREE.RepeatWrapping;
      return { colorTex, bumpTex };
    }

    // Build a 3D Food Medallion + 3D Shape using the generated food texture so it's 100% recognizable in 3D!
    function create3DFoodToken(slug) {
      const group = new THREE.Group();
      const meta = FOOD_META[slug] || { color: 0xffd60a };
      const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(0.38, 0.38, 0.12, 24),
        new THREE.MeshStandardMaterial({ color: meta.color, roughness: 0.3 })
      );
      rim.rotation.x = Math.PI / 2;
      group.add(rim);

      if (foodTextures[slug]) {
        const faceMat = new THREE.MeshBasicMaterial({ map: foodTextures[slug] });
        const faceFront = new THREE.Mesh(new THREE.CircleGeometry(0.34, 24), faceMat);
        faceFront.position.z = 0.065;
        group.add(faceFront);
        const faceBack = faceFront.clone();
        faceBack.rotation.y = Math.PI;
        faceBack.position.z = -0.065;
        group.add(faceBack);
      }
      return group;
    }

    function spawn3DFartPuffsFromBum() {
      if (typeof THREE === "undefined" || !hipFartAnchor || !fart3DParticlesGroup) return;
      const worldPos = new THREE.Vector3();
      hipFartAnchor.getWorldPosition(worldPos);

      for (let i = 0; i < 16; i++) {
        const puffColor = i % 2 === 0 ? 0x84cc16 : 0xd9f99d;
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(0.18 + Math.random() * 0.16, 12, 12),
          new THREE.MeshBasicMaterial({ color: puffColor, transparent: true, opacity: 0.92 })
        );
        puff.position.copy(worldPos);
        activeFartPuffs.push({
          mesh: puff,
          vx: 0.048 + Math.random() * 0.07,
          vy: 0.012 + Math.random() * 0.036,
          vz: (Math.random() - 0.5) * 0.036,
          age: 0
        });
        fart3DParticlesGroup.add(puff);
      }
    }

    let clockTime = 0;
    let lastFrameTime = performance.now();
    let activeBroccoliCard = null;
    function animateThreeScene() {
      requestAnimationFrame(animateThreeScene);
      const nowMs = performance.now();
      const dt = Math.min(0.15, Math.max(0.005, (nowMs - lastFrameTime) / 1000));
      lastFrameTime = nowMs;
      clockTime += dt * 1.05;

      // 1. Animate Small Fire Under the Pot
      if (flameTongues.length > 0) {
        for (let i = 0; i < flameTongues.length; i++) {
          const ft = flameTongues[i];
          const flicker = 0.82 + 0.30 * Math.sin(clockTime * ft.speed + ft.phase) + 0.14 * Math.cos(clockTime * 11.0 + i);
          ft.mesh.scale.y = Math.min(1.15, Math.max(0.55, flicker));
          ft.mesh.scale.x = 0.9 + 0.15 * Math.sin(clockTime * 8.5 + ft.phase);
          ft.mesh.scale.z = ft.mesh.scale.x;
          ft.mesh.position.y = ft.baseY * ft.mesh.scale.y;
        }
      }
      if (potFireLight) {
        potFireLight.intensity = 1.45 + Math.sin(clockTime * 10.0) * 0.24 + Math.cos(clockTime * 15.0) * 0.12;
      }

      // 2. Animate Natural Rippling Broth Surface & Simmering Bubbles in Both Cooking Pot & Dining Bowl
      if (potBrothMesh && brothGeo && brothGeo.attributes && brothGeo.attributes.position) {
        const posAttr = brothGeo.attributes.position;
        const waveSpeed = stirTimer > 0 ? 5.2 : 2.6;
        const waveAmp = stirTimer > 0 ? 0.052 : 0.032;
        for (let i = 0; i < posAttr.count; i++) {
          const vx = posAttr.getX(i);
          const vy = posAttr.getY(i);
          const r = Math.sqrt(vx * vx + vy * vy);
          const angle = Math.atan2(vy, vx);
          const w1 = Math.sin(r * 6.8 - clockTime * waveSpeed + angle * 2.0) * waveAmp;
          const w2 = Math.cos(vx * 5.4 + clockTime * (waveSpeed * 0.75)) * Math.sin(vy * 5.4 - clockTime * 2.0) * (waveAmp * 0.65);
          const edgeDamp = Math.max(0.2, Math.min(1.0, (1.32 - r) * 3.0));
          posAttr.setZ(i, (w1 + w2) * edgeDamp);
        }
        posAttr.needsUpdate = true;
        brothGeo.computeVertexNormals();
        potBrothMesh.rotation.z += (stirTimer > 0 ? 0.95 : 0.15) * dt;
      }

      if (simmeringBubbles.length > 0) {
        const swirlRate = (stirTimer > 0 ? 1.05 : 0.24) * dt;
        for (let i = 0; i < simmeringBubbles.length; i++) {
          const sb = simmeringBubbles[i];
          sb.angle += swirlRate * (i % 2 === 0 ? 1 : 0.7);
          const pulse = 0.65 + 0.55 * (0.5 + 0.5 * Math.sin(clockTime * sb.speed + sb.phase));
          sb.mesh.scale.x = pulse;
          sb.mesh.scale.z = pulse;
          sb.mesh.position.x = Math.cos(sb.angle) * sb.radius;
          sb.mesh.position.z = Math.sin(sb.angle) * sb.radius;
          sb.mesh.position.y = 0.01 + Math.sin(clockTime * sb.speed + sb.phase) * 0.018;
        }
      }

      // Animate Dining Bowl Broth Waves & Simmering Bubbles
      if (diningBrothMesh && diningBrothGeo && diningBrothGeo.attributes && diningBrothGeo.attributes.position) {
        const dPosAttr = diningBrothGeo.attributes.position;
        const dWaveSpeed = 3.0;
        const dWaveAmp = 0.030;
        for (let i = 0; i < dPosAttr.count; i++) {
          const vx = dPosAttr.getX(i);
          const vy = dPosAttr.getY(i);
          const r = Math.sqrt(vx * vx + vy * vy);
          const angle = Math.atan2(vy, vx);
          const w1 = Math.sin(r * 7.5 - clockTime * dWaveSpeed + angle * 2.0) * dWaveAmp;
          const w2 = Math.cos(vx * 6.0 + clockTime * 2.2) * Math.sin(vy * 6.0 - clockTime * 1.9) * (dWaveAmp * 0.65);
          const edgeDamp = Math.max(0.2, Math.min(1.0, (0.94 - r) * 3.2));
          dPosAttr.setZ(i, (w1 + w2) * edgeDamp);
        }
        dPosAttr.needsUpdate = true;
        diningBrothGeo.computeVertexNormals();
        diningBrothMesh.rotation.z += 0.22 * dt;
      }

      if (diningSimmeringBubbles.length > 0) {
        for (let i = 0; i < diningSimmeringBubbles.length; i++) {
          const dsb = diningSimmeringBubbles[i];
          dsb.angle += 0.30 * dt * (i % 2 === 0 ? 1 : 0.75);
          const pulse = 0.65 + 0.55 * (0.5 + 0.5 * Math.sin(clockTime * dsb.speed + dsb.phase));
          dsb.mesh.scale.x = pulse;
          dsb.mesh.scale.z = pulse;
          dsb.mesh.position.x = Math.cos(dsb.angle) * dsb.radius;
          dsb.mesh.position.z = Math.sin(dsb.angle) * dsb.radius;
          dsb.mesh.position.y = 0.01 + Math.sin(clockTime * dsb.speed + dsb.phase) * 0.016;
        }
      }

      if (diningBowlFoodGroup) {
        diningBowlFoodGroup.rotation.y += 0.35 * dt;
        diningBowlFoodGroup.children.forEach((child, idx) => {
          child.position.y = 0.04 + Math.sin(clockTime * 2.2 + idx) * 0.035;
        });
      }

      // 3. Animate Panda Position, Stirring from Outside the Pot, Broccoli Paw Smack, and Fart Pose
      if (pandaRig) {
        const isDining = window.gameState.sceneMode === "DINING_TABLE";
        const baseTargetX = isDining ? 14 : 0;
        // Panda stays outside & behind the pot towards the right (x = 1.55, z = -0.55), NEVER inside the pot!
        const defaultPandaX = isDining ? baseTargetX + 1.28 : 1.55;
        const defaultPandaZ = isDining ? -0.42 : -0.55;
        const pandaTargetX = fartPoseTimer > 0 ? (isDining ? baseTargetX + 1.38 : baseTargetX + 1.58) : defaultPandaX;
        const pandaTargetZ = fartPoseTimer > 0 ? (isDining ? -0.28 : -0.12) : defaultPandaZ;
        const pandaTargetY = fartPoseTimer > 0 ? 1.25 : 1.15;

        if (stirTimer > 0) {
          stirTimer = isDining ? 0 : Math.max(0, stirTimer - dt);
        }
        window.gameState.isStirring = (stirTimer > 0 && fartPoseTimer <= 0 && !isDining);

        if (woodenSpoon3D) {
          woodenSpoon3D.visible = !(pawWindupTimer > 0 || pawSwatTimer > 0 || isDining);
        }

        pandaRig.position.x += (pandaTargetX - pandaRig.position.x) * 0.18;
        pandaRig.position.y += (pandaTargetY - pandaRig.position.y) * 0.18;
        pandaRig.position.z += (pandaTargetZ - pandaRig.position.z) * 0.18;

        camera.position.x += (baseTargetX - camera.position.x) * 0.18;
        camera.lookAt(camera.position.x, 1.25, 0.3);

        if (fartPoseTimer > 0) {
          fartPoseTimer = Math.max(0, fartPoseTimer - dt);
          if (isDining) {
            // At the dining table, keep Panda's front chest & purple bib facing the bowl/camera while lifting its right leg to fart!
            pandaRig.rotation.y = -0.45 + Math.sin(clockTime * 11) * 0.06;
            pandaRig.rotation.x = 0.18;
            pandaRig.rotation.z = -0.10;
            pandaHead.rotation.y = 0.28;
            pandaHead.rotation.x = -0.08;
          } else {
            pandaRig.rotation.y = -1.75 + Math.sin(clockTime * 11) * 0.08;
            pandaRig.rotation.x = 0.42;
            pandaRig.rotation.z = 0.0;
            pandaHead.rotation.y = 1.55;
            pandaHead.rotation.x = -0.25;
          }
          if (pandaRightLeg) {
            pandaRightLeg.rotation.x = -1.25;
            pandaRightLeg.rotation.z = -0.35;
          }

          // Project Panda's 3D tail/rear-end world coordinate to 2D screen space using current-frame matrices
          if (hipFartAnchor && camera) {
            pandaRig.updateMatrixWorld(true);
            camera.updateMatrixWorld(true);
            const bumWorld = new THREE.Vector3();
            hipFartAnchor.getWorldPosition(bumWorld);
            bumWorld.project(camera);
            const sx = Math.min(window.innerWidth - 285, Math.max(20, Math.round((bumWorld.x * 0.5 + 0.5) * window.innerWidth + (isDining ? 24 : 4))));
            const sy = Math.round((-bumWorld.y * 0.5 + 0.5) * window.innerHeight + 8);
            fartCloudEl.style.left = sx + "px";
            fartCloudEl.style.top = sy + "px";
          }
        } else if (pawWindupTimer > 0 || pawSwatTimer > 0) {
          // Broccoli Paw Wind-Up & Big Smack-Away Swing!
          if (pawWindupTimer > 0) {
            pawWindupTimer = Math.max(0, pawWindupTimer - dt);
            // Panda turns slightly right and pulls its left paw back to wind up for the smack!
            pandaRig.rotation.y += (-0.55 - pandaRig.rotation.y) * 0.25;
            pandaRig.rotation.z += (-0.10 - pandaRig.rotation.z) * 0.25;
            if (pandaLeftArm) {
              pandaLeftArm.rotation.z += (-0.72 - pandaLeftArm.rotation.z) * 0.28;
              pandaLeftArm.rotation.x += (-1.05 - pandaLeftArm.rotation.x) * 0.28;
            }
            if (pawWindupTimer === 0) {
              pawSwatTimer = 1.25;
              headShakeTimer = Math.max(headShakeTimer, 1.5);
            }
          } else if (pawSwatTimer > 0) {
            pawSwatTimer = Math.max(0, pawSwatTimer - dt);
            // Panda swings its left paw energetically across to the left, smacking the broccoli away!
            pandaRig.rotation.y += (0.14 - pandaRig.rotation.y) * 0.30;
            pandaRig.rotation.z += (0.16 - pandaRig.rotation.z) * 0.30;
            if (pandaLeftArm) {
              pandaLeftArm.rotation.z += (1.75 - pandaLeftArm.rotation.z) * 0.34;
              pandaLeftArm.rotation.x += (-0.82 - pandaLeftArm.rotation.x) * 0.34;
            }
          }
        } else if (stirTimer > 0 && !isDining) {
          // Panda stirs the pot at a calm, natural pace while remaining completely OUTSIDE the pot at (1.55, 1.15, -0.55)!
          const stirAngle = clockTime * 3.4;
          pandaRig.rotation.y += (-0.38 - pandaRig.rotation.y) * 0.14;
          pandaRig.rotation.x += (0.08 - pandaRig.rotation.x) * 0.14;
          pandaRig.rotation.z = Math.sin(stirAngle) * 0.06;

          if (pandaLeftArm) {
            pandaLeftArm.rotation.z = 0.88 + Math.sin(stirAngle) * 0.22;
            pandaLeftArm.rotation.x = -0.68 + Math.cos(stirAngle) * 0.22;
          }
          if (woodenSpoon3D) {
            woodenSpoon3D.position.x = 0.18 + Math.cos(stirAngle) * 0.46;
            woodenSpoon3D.position.z = -0.10 + Math.sin(stirAngle) * 0.36;
            woodenSpoon3D.position.y = 0.84 + Math.sin(stirAngle * 2) * 0.035;
            woodenSpoon3D.rotation.z = -0.46 - Math.cos(stirAngle) * 0.16;
            woodenSpoon3D.rotation.x = 0.16 + Math.sin(stirAngle) * 0.16;
          }
        } else {
          const restRotY = isDining ? -0.18 : -0.24;
          pandaRig.rotation.y += (restRotY - pandaRig.rotation.y) * 0.14;
          pandaRig.rotation.x += (0 - pandaRig.rotation.x) * 0.14;
          pandaRig.rotation.z += (0 - pandaRig.rotation.z) * 0.14;
          if (pandaRightLeg) {
            pandaRightLeg.rotation.x += (0 - pandaRightLeg.rotation.x) * 0.16;
            pandaRightLeg.rotation.z += (0 - pandaRightLeg.rotation.z) * 0.16;
          }
          if (pandaLeftArm) {
            pandaLeftArm.rotation.z += (0 - pandaLeftArm.rotation.z) * 0.16;
            pandaLeftArm.rotation.x += (0 - pandaLeftArm.rotation.x) * 0.16;
          }
          if (woodenSpoon3D) {
            woodenSpoon3D.position.x += (0.62 - woodenSpoon3D.position.x) * 0.16;
            woodenSpoon3D.position.y += (0.86 - woodenSpoon3D.position.y) * 0.16;
            woodenSpoon3D.position.z += (-0.16 - woodenSpoon3D.position.z) * 0.16;
            woodenSpoon3D.rotation.z += (-0.42 - woodenSpoon3D.rotation.z) * 0.16;
            woodenSpoon3D.rotation.x += (0.14 - woodenSpoon3D.rotation.x) * 0.16;
          }
        }

        // Broccoli / Empty-Pot Head-Shake & Dining Spoon Chomp Animation
        if (headShakeTimer > 0) {
          headShakeTimer = Math.max(0, headShakeTimer - dt);
          pandaHead.rotation.y = Math.sin(clockTime * 10.5) * 0.42;
          pandaTongue.scale.z = 1.65;
        } else if (fartPoseTimer <= 0) {
          pandaHead.rotation.y *= 0.85;
          pandaHead.rotation.x *= 0.85;
          pandaTongue.scale.z = 0.6;
        }

        if (chompTimer > 0) {
          chompTimer = Math.max(0, chompTimer - dt);
          pandaRightArm.rotation.x = -0.6 + Math.sin(clockTime * 6.5) * 0.42;
          pandaHead.rotation.x = Math.sin(clockTime * 6.5) * 0.16;
        } else {
          pandaRightArm.rotation.z = 0;
          pandaRightArm.rotation.x = 0;
          if (fartPoseTimer <= 0 && headShakeTimer <= 0) {
            pandaHead.rotation.x = 0;
          }
        }
      }

      // Orbit floating 3D food tokens in the pot (swirls gently when Panda stirs!)
      if (floating3DFoodGroup) {
        floating3DFoodGroup.rotation.y += (window.gameState.isStirring ? 1.3 : 0.45) * dt;
        floating3DFoodGroup.children.forEach((child, idx) => {
          child.position.y = Math.sin(clockTime * 2.2 + idx) * 0.065;
        });
      }

      // Update single flying broccoli card in 100% lockstep with Panda's 3D left paw wind-up (0.74s) & smack-away (1.16s)!
      if (activeBroccoliCard) {
        activeBroccoliCard.elapsed += dt;
        const t = activeBroccoliCard.elapsed;
        const { el, startX, startY, midX, midY } = activeBroccoliCard;
        if (t < 0.74) {
          const u = t / 0.74;
          const dx = midX * u;
          const dy = midY * u - Math.sin(u * Math.PI) * 48;
          const sc = 1 + 0.16 * u;
          const rot = 34 * u;
          el.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${sc.toFixed(2)}) rotate(${rot.toFixed(1)}deg)`;
        } else if (t < 1.90) {
          const s = (t - 0.74) / 1.16;
          const endX = -startX - 220;
          const endY = midY - 220;
          const dx = midX + (endX - midX) * s;
          const dy = midY + (endY - midY) * s - Math.sin(s * Math.PI * 0.75) * 90;
          const sc = 1.16 - 0.40 * s;
          const rot = 34 - 560 * s;
          el.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${sc.toFixed(2)}) rotate(${rot.toFixed(1)}deg)`;
        } else {
          el.remove();
          activeBroccoliCard = null;
        }
      }

      // Update 3D green fart cloud puffs shooting from Panda's bottom
      for (let i = activeFartPuffs.length - 1; i >= 0; i--) {
        const fp = activeFartPuffs[i];
        fp.age += dt * 0.95;
        fp.mesh.position.x += fp.vx * (dt * 60);
        fp.mesh.position.y += fp.vy * (dt * 60);
        fp.mesh.position.z += fp.vz * (dt * 60);
        fp.mesh.scale.multiplyScalar(1 + 0.85 * dt);
        fp.mesh.material.opacity = Math.max(0, 0.92 - fp.age * 0.72);
        if (fp.age >= 1.3) {
          fart3DParticlesGroup.remove(fp.mesh);
          activeFartPuffs.splice(i, 1);
        }
      }

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    initThreeScene();

    // =========================================================================
    // GAMEPLAY INTERACTIONS: TOSS, BROCCOLI KNOCK-AWAY, FART, SMALL PANDA, RESET, SERVE
    // =========================================================================
    let fartTimeout = null;
    let broccoliTimeout = null;

    function clearTransientEffects(options) {
      const opts = options || {};
      stirTimer = 0;
      window.gameState.isStirring = false;
      headShakeTimer = 0;
      pawSwatTimer = 0;
      pawWindupTimer = 0;
      if (activeBroccoliCard) {
        activeBroccoliCard.el.remove();
        activeBroccoliCard = null;
      }
      if (broccoliTimeout) {
        clearTimeout(broccoliTimeout);
        broccoliTimeout = null;
      }
      broccoliBubbleEl.classList.remove("active");
      window.gameState.broccoliBubbleVisible = false;
      window.gameState.emptyPotWarningVisible = false;

      if (!opts.keepFart) {
        if (fartTimeout) {
          clearTimeout(fartTimeout);
          fartTimeout = null;
        }
        fartPoseTimer = 0;
        fartCloudEl.classList.remove("active");
        document.body.classList.remove("farting-now");
        window.gameState.fartCloudVisible = false;
        if (fart3DParticlesGroup) {
          while (fart3DParticlesGroup.children.length > 0) {
            fart3DParticlesGroup.remove(fart3DParticlesGroup.children[0]);
          }
        }
        activeFartPuffs.length = 0;
      }
    }

    function triggerPandaFart(options) {
      const opts = options || {};
      stirTimer = 0;
      window.gameState.isStirring = false;
      window.gameState.fartCount += 1;
      window.gameState.fartCloudVisible = true;
      fartPoseTimer = 1.65;
      fartCloudEl.classList.add("active");
      document.body.classList.add("farting-now");
      SoundFX.playPandaFartSound();
      spawn3DFartPuffsFromBum();
      if (!opts.preserveKidSpeech) {
        updateKidPandaSpeech("Hehe! Panda Fart! 💨😂", { queueAfterPanda: false });
      }

      if (fartTimeout) clearTimeout(fartTimeout);
      fartTimeout = setTimeout(() => {
        fartTimeout = null;
        fartCloudEl.classList.remove("active");
        document.body.classList.remove("farting-now");
        window.gameState.fartCloudVisible = false;
      }, 3000);
    }

    function triggerBroccoliKnockAway(btnEl) {
      window.gameState.broccoliRefusalCount += 1;
      window.gameState.broccoliBubbleVisible = true;
      window.gameState.emptyPotWarningVisible = false;
      const yuckFaceEl = broccoliBubbleEl.querySelector(".yuck-face");
      const msgEl = broccoliBubbleEl.querySelector(".broccoli-msg");
      if (yuckFaceEl) yuckFaceEl.textContent = "🐼🤚🥦😝";
      if (msgEl) msgEl.textContent = "Broccoli is gross!";
      broccoliBubbleEl.classList.add("active");

      // Immediately start Panda's paw wind-up (0.74s) and head shake so the player sees Panda preparing to smack it!
      stirTimer = 0;
      window.gameState.isStirring = false;
      pawWindupTimer = 0.74;
      pawSwatTimer = 0;
      headShakeTimer = 2.1;

      SoundFX.playBroccoliKnockAway();
      updateKidPandaSpeech("Yuck! Bye Broccoli! 🥦👋", { queueAfterPanda: true });

      // Single flying broccoli animation driven in lockstep with Panda's 3D left paw wind-up & smack-away!
      if (activeBroccoliCard) {
        activeBroccoliCard.el.remove();
        activeBroccoliCard = null;
      }
      if (btnEl) {
        const rect = btnEl.getBoundingClientRect();
        const card = document.createElement("div");
        card.className = "flying-food-card";
        card.innerHTML = `<img src="${window.FOOD_IMAGE_DATA["broccoli"]}" alt="Broccoli">`;
        card.style.left = rect.left + "px";
        card.style.top = rect.top + "px";
        document.body.appendChild(card);

        let smackScreenX = window.innerWidth * 0.57;
        let smackScreenY = window.innerHeight * 0.33;
        if (typeof THREE !== "undefined" && camera) {
          camera.updateMatrixWorld(true);
          const pawContactWorld = new THREE.Vector3(0.62, 1.75, -0.10);
          pawContactWorld.project(camera);
          smackScreenX = Math.round((pawContactWorld.x * 0.5 + 0.5) * window.innerWidth);
          smackScreenY = Math.round((-pawContactWorld.y * 0.5 + 0.5) * window.innerHeight);
        }
        const midX = (smackScreenX - 43) - rect.left;
        const midY = (smackScreenY - 43) - rect.top;
        activeBroccoliCard = {
          el: card,
          startX: rect.left,
          startY: rect.top,
          midX,
          midY,
          elapsed: 0
        };
      }

      if (broccoliTimeout) clearTimeout(broccoliTimeout);
      broccoliTimeout = setTimeout(() => {
        broccoliTimeout = null;
        broccoliBubbleEl.classList.remove("active");
        window.gameState.broccoliBubbleVisible = false;
      }, 3600);
    }

    function addTastyIngredient(slug, btnEl) {
      // State updates synchronously so automated tests and fast clicks work immediately
      window.gameState.potIngredients.push(slug);
      if (window.gameState.emptyPotWarningVisible) {
        broccoliBubbleEl.classList.remove("active");
        window.gameState.emptyPotWarningVisible = false;
      }
      renderRecipeCard();
      renderPotChips();
      SoundFX.playSplash();

      // Trigger Panda's 3D stirring animation at a calm, natural speed while Panda stays completely outside the pot!
      stirTimer = 1.65;
      window.gameState.isStirring = true;

      // Softly tint the warm golden broth toward the ingredient color without making it dark or opaque
      if (potBrothMesh && FOOD_META[slug] && typeof THREE !== "undefined") {
        const baseGolden = new THREE.Color(0xffe082);
        const ingColor = new THREE.Color(FOOD_META[slug].color);
        baseGolden.lerp(ingColor, 0.32);
        potBrothMesh.material.color.copy(baseGolden);
      }

      // Add 3D food medallion to pot broth (only animate the single 2D flying card from button into pot!)
      if (typeof THREE !== "undefined" && floating3DFoodGroup) {
        const floater = create3DFoodToken(slug);
        const angle = (window.gameState.potIngredients.length * 1.15) % (Math.PI * 2);
        const radius = 0.32 + (window.gameState.potIngredients.length % 3) * 0.24;
        floater.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
        floater.rotation.x = -Math.PI / 3;
        floating3DFoodGroup.add(floater);
        while (floating3DFoodGroup.children.length > 8) {
          floating3DFoodGroup.remove(floating3DFoodGroup.children[0]);
        }
      }

      // Visual 2D arc into the pot (slower 760ms flight so it is easy to follow)
      if (btnEl) {
        const rect = btnEl.getBoundingClientRect();
        const card = document.createElement("div");
        card.className = "flying-food-card";
        card.innerHTML = `<img src="${window.FOOD_IMAGE_DATA[slug]}" alt="${FOOD_META[slug].label}">`;
        card.style.left = rect.left + "px";
        card.style.top = rect.top + "px";
        document.body.appendChild(card);

        const targetX = window.innerWidth * 0.5 - 43 - rect.left;
        const targetY = window.innerHeight * 0.52 - 43 - rect.top;
        card.animate([
          { transform: "translate(0, 0) scale(1) rotate(0deg)" },
          { transform: `translate(${targetX * 0.5}px, ${targetY - 150}px) scale(1.18) rotate(160deg)`, offset: 0.5 },
          { transform: `translate(${targetX}px, ${targetY}px) scale(0.55) rotate(320deg)` }
        ], { duration: 760, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }).onfinish = () => card.remove();
      }

      // Occasional cute panda fart when tasting the stew during cooking (every 5th ingredient)!
      if (window.gameState.potIngredients.length % 5 === 0) {
        triggerPandaFart();
      } else {
        chompTimer = 0.85;
        updateKidPandaSpeech("Yum! More " + FOOD_META[slug].label + "! 🐼👏", { queueAfterPanda: false });
      }
    }

    // Attach Pantry Button Listeners
    document.querySelectorAll(".ingredient-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const slug = btn.getAttribute("data-ingredient");
        if (slug === "broccoli") {
          triggerBroccoliKnockAway(btn);
        } else {
          addTastyIngredient(slug, btn);
        }
      });
    });

    // Reset Stew Button (#btn-reset-stew)
    document.getElementById("btn-reset-stew").addEventListener("click", () => {
      window.gameState.potIngredients = [];
      clearTransientEffects({ keepFart: false });
      renderRecipeCard();
      renderPotChips();
      SoundFX.playResetWhoosh();
      if (potBrothMesh) {
        potBrothMesh.material.color.setHex(0xffe082);
      }
      if (floating3DFoodGroup) {
        while (floating3DFoodGroup.children.length > 0) {
          floating3DFoodGroup.remove(floating3DFoodGroup.children[0]);
        }
      }
      updateKidPandaSpeech("Fresh clean pot! 💧✨", { queueAfterPanda: false });
    });

    // Shuffle Recipe / Free-Play Mode Button (#btn-mode-freeplay)
    document.getElementById("btn-mode-freeplay").addEventListener("click", () => {
      window.gameState.recipeIndex = (window.gameState.recipeIndex + 1) % (window.gameState.recipePool.length + 1);
      if (window.gameState.recipeIndex === window.gameState.recipePool.length) {
        window.gameState.playMode = "FREEPLAY";
        recipeCardEl.classList.add("freeplay-mode");
        document.getElementById("recipe-mode-title").textContent = "Free Play!";
        document.getElementById("freeplay-btn-label").textContent = "Recipes";
      } else {
        window.gameState.playMode = "GUIDED";
        recipeCardEl.classList.remove("freeplay-mode");
        randomizeTargetRecipe();
        document.getElementById("recipe-mode-title").textContent = "Panda Wants";
        document.getElementById("freeplay-btn-label").textContent = "New Idea";
        renderRecipeCard();
      }
      SoundFX.playSplash();
    });

    // Quick Fart Button & Clickable Small Panda
    document.getElementById("btn-trigger-fart").addEventListener("click", () => {
      triggerPandaFart();
    });

    kidPandaEl.addEventListener("click", () => {
      updateKidPandaSpeech("Yay! Best Panda Stew! 🐼⭐", { queueAfterPanda: false });
      SoundFX.playSplash();
    });

    // Cook & Serve Button (#btn-cook-serve) -> Checks Actual Ingredients & Rejects Empty Pot!
    document.getElementById("btn-cook-serve").addEventListener("click", () => {
      // 1. Empty Pot Check: Do NOT auto-fill and do NOT say it's good!
      if (window.gameState.potIngredients.length === 0) {
        window.gameState.lastRewardDelta = 0;
        window.gameState.yummBubbleVisible = false;
        window.gameState.emptyPotWarningVisible = true;
        window.gameState.complimentText = "The pot is empty! Add some food first!";
        headShakeTimer = 1.45;

        const yuckFaceEl = broccoliBubbleEl.querySelector(".yuck-face");
        const msgEl = broccoliBubbleEl.querySelector(".broccoli-msg");
        if (yuckFaceEl) yuckFaceEl.textContent = "🍲🐼❓";
        if (msgEl) msgEl.textContent = "The pot is empty! Add some food first!";
        broccoliBubbleEl.classList.add("active");

        document.querySelectorAll(".ingredient-btn:not(.broccoli-warn)").forEach((b) => {
          b.classList.remove("pulse-hint");
          void b.offsetWidth;
          b.classList.add("pulse-hint");
        });

        SoundFX.playResetWhoosh();
        SoundFX.speakPandaWoman("The pot is empty! Add some food first!");
        updateKidPandaSpeech("Put some yummy food in the pot! 🍲🐼", { queueAfterPanda: true });

        if (broccoliTimeout) clearTimeout(broccoliTimeout);
        broccoliTimeout = setTimeout(() => {
          broccoliTimeout = null;
          broccoliBubbleEl.classList.remove("active");
          window.gameState.emptyPotWarningVisible = false;
        }, 3200);
        return;
      }

      clearTransientEffects({ keepFart: false });

      // 2. Check Actual Ingredients in the Meal Against the Target Recipe
      const uniqueServed = Array.from(new Set(window.gameState.potIngredients));
      const cookedLabels = uniqueServed.slice(0, 6).map((s) => FOOD_META[s] ? FOOD_META[s].label : s);
      const matched = window.gameState.currentRecipe.every((req) => window.gameState.potIngredients.includes(req));
      const missingRecipeLabels = window.gameState.currentRecipe
        .filter((req) => !window.gameState.potIngredients.includes(req))
        .map((s) => FOOD_META[s] ? FOOD_META[s].label : s);

      const earned = matched ? 3 : 1;
      window.gameState.stars += earned;
      window.gameState.lastRewardDelta = earned;
      window.gameState.lastServedMatchedRecipe = matched;
      starCountValueEl.textContent = String(window.gameState.stars);
      starCounterEl.classList.add("bump");
      setTimeout(() => starCounterEl.classList.remove("bump"), 450);

      // Transition to Dining Table Scene
      window.gameState.sceneMode = "DINING_TABLE";
      window.gameState.yummBubbleVisible = true;
      window.gameState.kidPandaVisible = true;
      window.gameState.kidPandaContext = "DINING_TABLE";

      let chosenCompliment = "";
      if (matched) {
        yummBubbleEl.textContent = "Yumm! ⭐⭐⭐";
        chosenCompliment = "Yumm! You cooked the " + cookedLabels.join(", ") + " recipe! You're the best chef!";
      } else if (window.gameState.playMode === "GUIDED" && missingRecipeLabels.length > 0) {
        yummBubbleEl.textContent = "Yumm! ⭐";
        chosenCompliment = "Yumm! Tasty " + cookedLabels.join(" & ") + " stew! (+1⭐ — add " + missingRecipeLabels.join(" & ") + " for +3⭐!)";
      } else {
        yummBubbleEl.textContent = "Yumm! ⭐";
        chosenCompliment = "Yumm! Delicious " + cookedLabels.join(", ") + " stew!";
      }
      window.gameState.complimentText = chosenCompliment;
      complimentBubbleEl.textContent = chosenCompliment;

      // Sync the dining bowl broth tint with the cooked stew broth color!
      if (diningBrothMesh && potBrothMesh) {
        diningBrothMesh.material.color.copy(potBrothMesh.material.color);
      }

      // Populate Served Dish Showcase & 3D Dining Bowl Broth with the exact cooked ingredients
      diningBowlItemsEl.innerHTML = "";
      if (diningBowlFoodGroup) {
        while (diningBowlFoodGroup.children.length > 0) {
          diningBowlFoodGroup.remove(diningBowlFoodGroup.children[0]);
        }
      }
      const servedCounts = {};
      window.gameState.potIngredients.forEach((s) => {
        servedCounts[s] = (servedCounts[s] || 0) + 1;
      });
      uniqueServed.slice(0, 6).forEach((slug, idx, arr) => {
        const count = servedCounts[slug] || 1;
        const badgeHtml = count > 1
          ? `<span class="chip-count-badge">x${count}</span>`
          : "";
        const item = document.createElement("div");
        item.className = "served-item-card";
        item.setAttribute("data-ingredient", slug);
        item.setAttribute("data-count", String(count));
        item.innerHTML = `
          <img src="${window.FOOD_IMAGE_DATA[slug]}" alt="${FOOD_META[slug].label}">
          <span>${FOOD_META[slug].label}</span>
          ${badgeHtml}
        `;
        diningBowlItemsEl.appendChild(item);

        if (typeof THREE !== "undefined" && diningBowlFoodGroup) {
          const token = create3DFoodToken(slug);
          token.scale.set(0.76, 0.76, 0.76);
          const a = (idx / Math.max(1, arr.length)) * Math.PI * 2;
          const r = arr.length === 1 ? 0.12 : 0.38;
          token.position.set(Math.cos(a) * r, 0.04, Math.sin(a) * r);
          token.rotation.x = -Math.PI / 3;
          diningBowlFoodGroup.add(token);
        }
      });

      if (pandaBib) pandaBib.visible = true;
      if (pandaSpoon) pandaSpoon.visible = true;
      chompTimer = 2.6;

      diningSceneEl.classList.add("active");
      diningSceneEl.setAttribute("aria-hidden", "false");
      document.body.classList.add("in-dining-mode");
      kidPandaEl.classList.add("active", "dining-pos");

      SoundFX.playYummFanfare(chosenCompliment);
      // Trigger the unmistakable panda rear-end fart during the meal celebration while queuing the small panda's dining line!
      triggerPandaFart({ preserveKidSpeech: true });
      updateKidPandaSpeech("Yumm! Save some for me! 🐼🥄", { queueAfterPanda: true });
    });

    // Dining Table Controls
    document.getElementById("btn-dining-bite").addEventListener("click", () => {
      chompTimer = 1.8;
      const nextComp = COMPLIMENTS[Math.floor(Math.random() * COMPLIMENTS.length)];
      complimentBubbleEl.textContent = nextComp;
      SoundFX.playYummFanfare(nextComp);
    });

    document.getElementById("btn-dining-fart").addEventListener("click", () => {
      triggerPandaFart();
    });

    document.getElementById("btn-cook-again").addEventListener("click", () => {
      clearTransientEffects({ keepFart: false });
      window.gameState.sceneMode = "COOKING_COUNTER";
      window.gameState.playMode = "GUIDED";
      window.gameState.recipeIndex = 0;
      window.gameState.potIngredients = [];
      randomizeTargetRecipe();
      recipeCardEl.classList.remove("freeplay-mode");
      document.getElementById("recipe-mode-title").textContent = "Panda Wants";
      document.getElementById("freeplay-btn-label").textContent = "New Idea";
      diningSceneEl.classList.remove("active");
      diningSceneEl.setAttribute("aria-hidden", "true");
      document.body.classList.remove("in-dining-mode");
      kidPandaEl.classList.remove("dining-pos");
      if (pandaBib) pandaBib.visible = false;
      if (pandaSpoon) pandaSpoon.visible = false;
      if (potBrothMesh) {
        potBrothMesh.material.color.setHex(0xffe082);
      }
      if (diningBrothMesh) {
        diningBrothMesh.material.color.setHex(0xffe082);
      }
      if (floating3DFoodGroup) {
        while (floating3DFoodGroup.children.length > 0) {
          floating3DFoodGroup.remove(floating3DFoodGroup.children[0]);
        }
      }
      renderRecipeCard();
      renderPotChips();
      SoundFX.playResetWhoosh();
      updateKidPandaSpeech("Let's cook again! 🐼🍲", { queueAfterPanda: false });
    });
  </script>
</body>
</html>
