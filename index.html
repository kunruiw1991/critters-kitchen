<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌈🍳</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="kitchen-app">
    <!-- 1. Top Header Bar (100% Icon-Only for 5yo) -->
    <header class="top-header">
      <div class="brand-title">
        <span>🌈🍳</span>
      </div>
      <div class="customer-strip" id="customerStrip"></div>
      <div class="top-actions">
        <span class="star-badge">⭐ <span id="starCount">0</span></span>
        <button class="pill-btn gold" id="openAlbumBtn">📸 <span id="albumCount">0</span></button>
        <button class="pill-btn" id="modeToggleBtn">💭</button>
        <button class="pill-btn" id="newDishBtn">🔄</button>
        <button class="pill-btn" id="voiceToggleBtn">🗣️</button>
        <button class="pill-btn" id="muteToggleBtn">🔊</button>
      </div>
    </header>

    <!-- 2. Visual Pictogram Step Bar & Giant 1-Tap Action Button -->
    <section class="guide-strip">
      <div class="step-prompt" id="stepPromptText">👆 🍓 🍌 🥚 ➡️ 🔪</div>
      <button class="primary-action-btn" id="primaryActionBtn">🔪✨</button>
    </section>

    <!-- 3. Main Interactive 2D Storybook Kitchen Canvas -->
    <main class="canvas-stage">
      <canvas id="kitchenCanvas"></canvas>
      <div class="prep-tray-overlay" id="prepTrayStrip"></div>
    </main>

    <!-- 4A. Ingredient Picture Drawer (Visible on Stations 1, 2, 3) -->
    <section class="bottom-shelf-panel" id="ingredientDrawer">
      <div class="cat-tabs" id="catTabs"></div>
      <div class="ingredient-shelf" id="ingredientShelf"></div>
    </section>

    <!-- 4B. Decoration & Piping Toolbar (Visible on Station 4) -->
    <section class="bottom-shelf-panel" id="decorToolbar" style="display:none;"></section>

    <!-- 5. 5-Station Giant Icon Navigation Dock -->
    <nav class="station-dock">
      <button class="station-btn active" data-station="1">🔪</button>
      <button class="station-btn" data-station="2">🥣</button>
      <button class="station-btn" data-station="3">🍳</button>
      <button class="station-btn" data-station="4">🧁</button>
      <button class="station-btn" data-station="5">🍽️</button>
    </nav>
  </div>

  <!-- Photo Sticker Album Modal (100% Zero-Text) -->
  <div class="modal-backdrop hidden" id="albumModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>📸 ⭐</span>
        <button class="pill-btn" id="closeAlbumBtn">✖</button>
      </div>
      <div class="album-grid" id="albumGrid"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
