<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌈🍳 楚楚的彩虹料理屋 — Chuyu's Rainbow Kitchen!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="kitchen-app">
    <!-- 1. Top Header Bar -->
    <header class="top-header">
      <div class="brand-title">
        <span>🌈🍳 楚楚的彩虹料理屋</span>
      </div>
      <div class="customer-strip" id="customerStrip" aria-label="选择小动物客人"></div>
      <div class="top-actions">
        <span class="star-badge" title="获得的美味星星">⭐ <span id="starCount">0</span></span>
        <button class="pill-btn gold" id="openAlbumBtn">📖 贴纸相册 (<span id="albumCount">0</span>)</button>
        <button class="pill-btn" id="modeToggleBtn">📋 心愿点单模式</button>
        <button class="pill-btn" id="newDishBtn">🔄 换个新菜</button>
        <button class="pill-btn" id="voiceToggleBtn">🗣️ 语音: 开</button>
        <button class="pill-btn" id="muteToggleBtn">🔊 音效</button>
      </div>
    </header>

    <!-- 2. Kid-Friendly Step Prompt & 1-Tap Action Button -->
    <section class="guide-strip">
      <div class="step-prompt" id="stepPromptText">👇 从下方点选喜欢的食材放到菜板上切一切吧！</div>
      <button class="primary-action-btn" id="primaryActionBtn">🔪 咔嚓切一刀！</button>
    </section>

    <!-- 3. Main Interactive 2D Storybook Kitchen Canvas -->
    <main class="canvas-stage">
      <canvas id="kitchenCanvas"></canvas>
      <div class="prep-tray-overlay" id="prepTrayStrip"></div>
    </main>

    <!-- 4A. Ingredient Drawer (Visible on Stations 1, 2, 3) -->
    <section class="bottom-shelf-panel" id="ingredientDrawer">
      <div class="cat-tabs" id="catTabs"></div>
      <div class="ingredient-shelf" id="ingredientShelf"></div>
    </section>

    <!-- 4B. Decoration & Piping Toolbar (Visible on Station 4) -->
    <section class="bottom-shelf-panel" id="decorToolbar" style="display:none;"></section>

    <!-- 5. 5-Station Kitchen Navigation Dock -->
    <nav class="station-dock" aria-label="料理步骤工位">
      <button class="station-btn active" data-station="1">🔪 1. 切菜备料</button>
      <button class="station-btn" data-station="2">🥣 2. 搅拌榨汁</button>
      <button class="station-btn" data-station="3">🍳 3. 煎锅烤箱</button>
      <button class="station-btn" data-station="4">🎂 4. 挤奶油装饰</button>
      <button class="station-btn" data-station="5">🍽️ 5. 喂食试吃</button>
    </nav>
  </div>

  <!-- Photo Sticker Album Modal -->
  <div class="modal-backdrop hidden" id="albumModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>📖 楚楚的小厨神贴纸相册</span>
        <button class="pill-btn" id="closeAlbumBtn">✖ 关闭</button>
      </div>
      <div class="album-grid" id="albumGrid"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
